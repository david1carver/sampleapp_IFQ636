# scripts/nginx/restaurant-review.conf  (paste into /etc/nginx/sites-available/default)
# nginx listens on :80 and reverse-proxies the React SPA served by pm2 on :3000.
# The backend API is reached by the browser directly on http://<public-ip>:5001
# (axiosConfig.jsx "live" baseURL), so open ports 80 and 5001 in the EC2
# security group.

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
