name: Backend CI

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [22]
    environment: MONGO_URI
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Print Env Secret
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: ${{ secrets.PORT }}
        run: |
          echo "Secret 1 is: $MONGO_URI"
          echo "Secret 2 is: $JWT_SECRET"
          echo "Secret 3 is: $PORT"

      # Stop the currently running app so we can rebuild/redeploy it.
      - name: Stop running services (pm2)
        run: pm2 stop all || true

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          npm install --global yarn
          yarn --version
          yarn install

      - name: Install Frontend Dependencies and Build
        working-directory: ./frontend
        env:
          CI: 'false'   # treat CRA build warnings as warnings, not errors
        run: |
          df -h
          sudo rm -rf ./build
          yarn install
          yarn run build

      - name: Run Backend Tests
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: ${{ secrets.PORT }}
        working-directory: ./backend
        run: npm test

      - name: Install root dependencies
        run: npm ci

      # Write the production .env for the backend from the single PROD secret
      # (which contains the full MONGO_URI / JWT_SECRET / PORT file).
      - name: Create production .env in backend
        run: |
          cd ./backend
          touch .env
          echo "${{ secrets.PROD }}" > .env

      # Restart the pm2-managed backend + frontend (registered once manually).
      # The "|| true" lets the very first run pass before the processes exist;
      # after you register them once (see the deploy guide), restart updates them.
      - name: Start and restart services (pm2)
        run: |
          pm2 start all || true
          pm2 restart all || true
          pm2 save || true
